<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Potato Tap Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./style.css?v=1.2">
</head>
<body>
  <div id="app">
    <!-- Top Stats Bar -->
    <header class="top-bar">
      <div class="user-pill">
        <span class="user-avatar">🥔</span>
        <span id="username">Player</span>
      </div>
      <div class="resource-badge">
        <span class="res-icon">🥔</span>
        <span id="balance">0</span>
      </div>
      <div class="resource-badge energy-badge">
        <span class="res-icon">⚡</span>
        <span id="energy">50</span>/<span id="maxEnergy">50</span>
      </div>
    </header>

    <!-- Tab 1: Tap Game Stage -->
    <main id="tab-tap" class="tab-content active">
      <div class="game-stage">
        <!-- Floating Badges Container around Potato -->
        <div class="potato-container">
          <div class="badge-slot badge-top-left" id="badge-bronze" title="Bronze Tapper"></div>
          <div class="badge-slot badge-top-right" id="badge-silver" title="Silver Tapper"></div>
          <div class="badge-slot badge-bottom-left" id="badge-gold" title="Gold Tapper"></div>
          <div class="badge-slot badge-bottom-right" id="badge-diamond" title="Diamond Tapper"></div>

          <!-- Central Tap Button -->
          <div class="tap-area" id="tapButton">
            <span class="potato-hero">🥔</span>
          </div>
        </div>
      </div>

      <!-- Visible Energy Recharge Bar -->
      <div class="energy-bar-wrapper">
        <div class="energy-bar">
          <div class="energy-fill" id="energyFill"></div>
        </div>
      </div>
    </main>

    <!-- Tab 2: Upgrades Section -->
    <section id="tab-upgrade" class="tab-content">
      <div class="section-banner">
        <h2>BOOSTERS & GEAR 🚀</h2>
        <p class="subtitle">Upgrade your tapping power and passive income!</p>
      </div>
      <div class="upgrades-grid">
        <!-- Upgrade 1: Auto Bot -->
        <div class="upgrade-card">
          <div class="upgrade-icon">🤖</div>
          <div class="upgrade-title">AUTO BOT</div>
          <div class="upgrade-benefit">+100/hr 🥔</div>
          <button class="upgrade-btn" id="btn-autobot">🥔 1,000</button>
        </div>

        <!-- Upgrade 2: Multi-Tap -->
        <div class="upgrade-card">
          <div class="upgrade-icon">🚀</div>
          <div class="upgrade-title">MULTI-TAP</div>
          <div class="upgrade-benefit">+2 per tap</div>
          <button class="upgrade-btn" id="btn-multitap">🥔 500</button>
        </div>

        <!-- Upgrade 3: Max Energy -->
        <div class="upgrade-card">
          <div class="upgrade-icon">🔋</div>
          <div class="upgrade-title">MAX ENERGY</div>
          <div class="upgrade-benefit">+15 Max Taps</div>
          <button class="upgrade-btn" id="btn-maxenergy">🥔 250</button>
        </div>
      </div>
    </section>

    <!-- Tab 3: Tasks Section -->
    <section id="tab-earn" class="tab-content">
      <div class="section-banner">
        <h2>COMPLETE & EARN 🎯</h2>
        <p class="subtitle">Finish tasks to claim instant potato bonuses!</p>
      </div>
      <div id="tasksList" class="tasks-container"></div>
    </section>

    <!-- Tab 4: Friends Section -->
    <section id="tab-friends" class="tab-content">
      <div class="section-banner">
        <h2>INVITE FRIENDS 👥</h2>
        <p class="subtitle">Earn 5,000 Potatoes for every friend invited!</p>
      </div>
      <div class="cartoon-card">
        <div class="invite-icon">🎁</div>
        <button class="cartoon-btn btn-green" id="inviteBtn">INVITE A FRIEND</button>
      </div>
    </section>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="tab-tap">
        <span class="nav-icon">🥔</span>
        <label>TAP</label>
      </button>
      <button class="nav-btn" data-tab="tab-upgrade">
        <span class="nav-icon">⚡</span>
        <label>UPGRADE</label>
      </button>
      <button class="nav-btn" data-tab="tab-earn">
        <span class="nav-icon">🎯</span>
        <label>EARN</label>
      </button>
      <button class="nav-btn" data-tab="tab-friends">
        <span class="nav-icon">👥</span>
        <label>FRIENDS</label>
      </button>
    </nav>
  </div>

  <script src="app.js?v=1.2"></script>
</body>
</html>
